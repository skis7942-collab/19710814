<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제주 가족여행 4일</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#1d2733;--sub:#6b7785;--pri:#0f8fa8;--pri2:#e3f4f8;--line:#e3e8ee;--danger:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#18212a;--ink:#e8eef4;--sub:#93a0ae;--pri:#4cc3da;--pri2:#173943;--line:#27323d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Noto Sans KR",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:20px 16px 8px}
h1{margin:0;font-size:22px}
.sub{color:var(--sub);font-size:14px}
main{padding:0 16px 16px;max-width:640px;margin:auto}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;color:var(--sub);padding:10px 0;font-size:12px;min-height:56px}
.tabbar button b{display:block;font-size:20px;font-weight:400}
.tabbar button.on{color:var(--pri);font-weight:700}
.days{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 16px;min-height:40px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.item{display:flex;gap:10px}
.time{width:48px;flex:none;color:var(--pri);font-weight:700;font-size:14px}
.item h3{margin:0;font-size:16px}
.note{color:var(--sub);font-size:14px}
.tag{display:inline-block;font-size:11px;background:var(--pri2);color:var(--pri);border-radius:8px;padding:1px 8px;margin-left:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.d{color:var(--danger)}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:4px 0}
label{font-size:13px;color:var(--sub)}
.hero{width:100%;height:180px;object-fit:cover;border-radius:14px;display:block;margin:4px 0 10px}
iframe{width:100%;height:60vh;border:0;border-radius:14px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;margin:0}
.check.done span{text-decoration:line-through;color:var(--sub)}
.check span{flex:1}
.sum{font-size:24px;font-weight:700}
dialog{border:0;border-radius:16px;width:calc(100% - 32px);max-width:480px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0006}
.hidden{display:none}
</style>
</head>
<body>
<header>

</header>
<main id="app"></main>
<nav class="tabbar" id="tabs"></nav>
<dialog id="dlg"><form method="dialog" id="form"></form></dialog>

const CAP=['이호테우해변 일몰 · 빨강·하양 말 등대','쇠소깍 · 에메랄드빛 물과 테우','협재해변 · 멀리 보이는 비양도','함덕해변'];
const TIP=['도착이 늦으면 동문시장을 빼고 이호테우해변 일몰만 보고 호텔로 이동 (11월 일몰 약 17:30)','날씨가 나쁘면 카약·테우 체험은 빼고 호텔 스파·수영으로 대체','비 오는 날은 신화월드·오설록 등 실내 위주로','출발이 이르면 표선해변을 빼고 함덕만 들르거나 바로 공항으로. 출발 2시간 전 공항 도착 권장'];
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=structuredClone(DEFAULT);
S.day??=0;S.tab??='plan';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const TABS=[['plan','📅','일정'],['map','🗺️','지도'],['cost','💰','정산'],['book','🔗','예약'],['pack','🎒','준비물']];
const naver=p=>'https://map.naver.com/p/search/'+encodeURIComponent(p);

function render(){
 $('#tabs').innerHTML=TABS.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';save();render()"><b>${i}</b>${l}</button>`).join('');
 $('#app').innerHTML={plan,map,cost,book,pack}[S.tab]();
}
const dayChips=()=>`<div class="days">${S.days.map((d,i)=>`<button class="chip ${S.day===i?'on':''}" onclick="S.day=${i};save();render()">${i+1}일차</button>`).join('')}</div>`;

function plan(){
 const d=S.days[S.day];
 return dayChips()+(HERO[S.day]?`<img class="hero" src="${HERO[S.day]}" alt="${esc(CAP[S.day])}" onerror="this.remove()"><div class="note" style="margin:-4px 0 6px">📷 ${esc(CAP[S.day])}</div>`:'')+`<h2 style="margin:4px 0">${esc(d.title)}</h2>`+(TIP[S.day]?`<div class="card note">💡 ${esc(TIP[S.day])}</div>`:'')+
 d.items.map((it,i)=>`<div class="card item"><div class="time">${esc(it.time)}</div><div style="flex:1">
  <h3>${esc(it.title)}<span class="tag">${esc(it.cat)}</span></h3>
  ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
  <div class="row"><a class="btn" target="_blank" rel="noopener" href="${naver(it.place)}">📍 길찾기</a>
  <button class="btn" onclick="editItem(${i})">✏️ 편집</button>
  <button class="btn" onclick="moveItem(${i},-1)" aria-label="위로">↑</button>
  <button class="btn" onclick="moveItem(${i},1)" aria-label="아래로">↓</button></div></div></div>`).join('')+
 `<button class="btn p" onclick="editItem(-1)" style="width:100%;justify-content:center">＋ 일정 추가</button>
 <div class="card"><b>☔ 비 오는 날 예비 코스</b><div class="note">실내: 제주신화월드, 오설록 티뮤지엄, 이중섭거리·미술관, 서귀포 매일올레시장<br>바다 대체: 호텔 스파·수영장, 카페에서 바다 보기</div></div>`;
}
function editItem(i){
 const it=i<0?{time:'',title:'',place:'',cat:'자연',note:''}:S.days[S.day].items[i];
 $('#form').innerHTML=`<h3>${i<0?'일정 추가':'일정 편집'}</h3>
 <label>시간</label><input id="f_time" value="${esc(it.time)}" placeholder="예: 10:30">
 <label>제목</label><input id="f_title" value="${esc(it.title)}">
 <label>장소 (지도 검색어)</label><input id="f_place" value="${esc(it.place)}">
 <label>분류</label><select id="f_cat">${CATS.map(c=>`<option ${c===it.cat?'selected':''}>${c}</option>`).join('')}</select>
 <label>메모</label><textarea id="f_note" rows="2">${esc(it.note)}</textarea>
 <div class="row"><button class="btn p" value="x" onclick="saveItem(${i});return false">저장</button>
 ${i>=0?`<button class="btn d" onclick="delItem(${i});return false">삭제</button>`:''}
 <button class="btn" value="cancel">닫기</button></div>`;
 $('#dlg').showModal();
}
function saveItem(i){
 const it={time:$('#f_time').value,title:$('#f_title').value,place:$('#f_place').value||$('#f_title').value,cat:$('#f_cat').value,note:$('#f_note').value};
 const a=S.days[S.day].items;
 if(i<0)a.push(it);else a[i]=it;
 a.sort((x,y)=>(x.time||'').localeCompare(y.time||''));
 save();$('#dlg').close();render();
}
function delItem(i){if(confirm('삭제할까요?')){S.days[S.day].items.splice(i,1);save();$('#dlg').close();render()}}
function moveItem(i,d){const a=S.days[S.day].items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}

let mapQ=null;
function map(){
 const d=S.days[S.day];
 const q=mapQ??d.items[0]?.place??'제주도';
 const places=d.items.map(it=>it.place);
 return dayChips()+`<iframe title="지도" src="https://maps.google.com/maps?q=${encodeURIComponent(q+' 제주')}&output=embed&hl=ko"></iframe>
 <div class="row">${[...new Set(places)].map(p=>`<button class="chip ${p===q?'on':''}" onclick="mapQ='${esc(p).replace(/'/g,"\\'")}';render()">${esc(p)}</button>`).join('')}</div>
 <div class="row"><a class="btn p" target="_blank" rel="noopener" href="${naver(q)}">네이버지도에서 열기</a></div>`;
}
const _setDay=null;

function cost(){
 const m=S.members,n=m.length;
 const total=S.expenses.reduce((s,e)=>s+Number(e.amt),0);
 const paid=m.map(x=>S.expenses.filter(e=>e.who===x).reduce((s,e)=>s+Number(e.amt),0));
 const per=total/n;
 const bal=paid.map(p=>p-per);
 // 정산: 받을 사람/보낼 사람 매칭
 let cr=bal.map((b,i)=>[i,b]).filter(x=>x[1]>0.5),db=bal.map((b,i)=>[i,-b]).filter(x=>x[1]>0.5);
 const tx=[];
 while(cr.length&&db.length){const a=Math.min(cr[0][1],db[0][1]);tx.push(`${m[db[0][0]]} → ${m[cr[0][0]]} <b>${won(Math.round(a))}</b>`);cr[0][1]-=a;db[0][1]-=a;if(cr[0][1]<.5)cr.shift();if(db[0][1]<.5)db.shift()}
 return `<div class="card"><div class="sub">총 지출 (${n}명 균등 분담)</div><div class="sum">${won(total)}</div><div class="sub">1인당 ${won(Math.round(per))}</div></div>
 <div class="card"><b>정산 결과</b>${tx.length?tx.map(t=>`<div>${t}</div>`).join(''):'<div class="note">정산할 내역이 없어요</div>'}</div>
 <div class="card"><b>지출 추가</b>
 <input id="e_t" placeholder="항목 (예: 동문시장 점심)">
 <input id="e_a" type="number" inputmode="numeric" placeholder="금액(원)">
 <select id="e_w">${m.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
 <button class="btn p" onclick="addExp()" style="width:100%;justify-content:center">추가 (결제자 선택)</button></div>`+
 S.expenses.map((e,i)=>`<div class="card item"><div style="flex:1"><b>${esc(e.t)}</b><div class="note">${esc(e.who)} 결제</div></div><div>${won(e.amt)}</div><button class="btn d" onclick="S.expenses.splice(${i},1);save();render()" aria-label="삭제">✕</button></div>`).join('');
}
function addExp(){
 const t=$('#e_t').value.trim(),a=Number($('#e_a').value);
 if(!t||!a)return alert('항목과 금액을 입력하세요');
 S.expenses.push({t,amt:a,who:$('#e_w').value});save();render();
}

function book(){
 return `<p class="note">링크와 메모를 직접 입력해 두세요.</p>`+S.bookings.map((b,i)=>`<div class="card">
 <b>${esc(b.name)}</b>
 <input value="${esc(b.url)}" placeholder="예약 링크 URL" onchange="S.bookings[${i}].url=this.value;save();render()">
 <input value="${esc(b.memo)}" placeholder="메모" onchange="S.bookings[${i}].memo=this.value;save()">
 ${/^https?:\/\//.test(b.url)?`<a class="btn p" target="_blank" rel="noopener" href="${esc(b.url)}">예약 열기</a>`:''}</div>`).join('')+
 `<button class="btn" onclick="const n=prompt('예약 이름');if(n){S.bookings.push({name:n,url:'',memo:''});save();render()}">＋ 예약 추가</button>`;
}

function pack(){
 const done=S.checklist.filter(c=>c.d).length;
 return `<p class="note">${done} / ${S.checklist.length} 준비 완료</p>`+S.checklist.map((c,i)=>`<div class="check ${c.d?'done':''}">
 <input type="checkbox" ${c.d?'checked':''} onchange="S.checklist[${i}].d=this.checked;save();render()"><span>${esc(c.t)}</span>
 <button class="btn d" onclick="S.checklist.splice(${i},1);save();render()" aria-label="삭제">✕</button></div>`).join('')+
 `<div class="row"><input id="p_new" placeholder="준비물 추가" style="flex:1"><button class="btn p" onclick="const v=$('#p_new').value.trim();if(v){S.checklist.push({t:v,d:0});save();render()}">추가</button></div>`;
}
render();
</script>
